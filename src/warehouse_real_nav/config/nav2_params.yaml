amcl:
  ros__parameters:
    use_sim_time: False
    alpha1: 0.5       # Rotation noise from rotation — 35kg inertia causes heading lag during slip
    alpha2: 0.5       # Rotation noise from translation — wheel slip generates heading error
    alpha3: 0.4       # Translation noise from translation — primary wheel-slip axis
    alpha4: 0.4       # Translation noise from rotation — heavy chassis skids during turns
    alpha5: 0.2       # Translational noise for omni robots — N/A for diff drive, unchanged
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 3.0   # Wider gradient for scan-matching recovery (was 2.0)
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 90        # More beams = stronger Lidar correction signal per update (was 60)
    max_particles: 3000  # More particles survive sudden odometry jumps (was 2000)
    min_particles: 600   # Proportional floor increase (was 500)
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.1    # Enable adaptive particle injection — fast tracker (was 0.0)
    recovery_alpha_slow: 0.001  # Slow tracker for sustained mismatch — must be < fast (was 0.0)
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.05   # Trigger Lidar update every ~2.9° rotation — catch slip early (was 0.2)
    update_min_d: 0.10   # Trigger Lidar update every 10 cm translation — 2.5× more frequent (was 0.25)
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan


    # Set your robot's initial pose (used on startup)
    #set_initial_pose: true
    #initial_pose:
    #  x: 0.0
    #  y: 0.0
    #  z: 0.0
    #  yaw: 0.0


