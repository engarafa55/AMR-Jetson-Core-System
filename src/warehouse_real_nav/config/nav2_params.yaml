controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    # Goal checker parameters
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      # TWEAK 1: Increased yaw tolerance to 0.40 (approx 23 deg) to prevent oscillation/dancing at the goal
      yaw_goal_tolerance: 0.40

    # ── MPPI Controller (replaces DWBLocalPlanner) ────────────────────
    # Optimized for: 35 kg diff-drive, Jetson Nano (CPU-only), 80 cm corridor entry
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"

      # ── Trajectory Sampling (Jetson Nano tuned) ──
      time_steps: 28            # 28 × 0.1s = 2.8s lookahead (reduced from 40 for Nano)
      model_dt: 0.1             # 100 ms per timestep
      batch_size: 500           # 500 rollouts per cycle (reduced from 1000 for Nano)
      iteration_count: 1        # Single optimization pass — saves ~50% CPU vs 2
      temperature: 0.25         # Lower = exploit best trajectories (less random exploration)
      gamma: 0.015              # Discount factor for trajectory costs over time

      # ── Velocity Bounds (Differential Drive) ──
      motion_model: "DiffDrive"
      vx_max: 0.26              # Max forward speed — matches existing robot capability
      vx_min: -0.15             # Gentle reverse for escape maneuvers in tight spaces
      vy_max: 0.0               # No lateral motion (diff drive constraint)
      wz_max: 0.50              # 28.6°/s max rotation — safe for 35 kg, 2× the old DWB limit

      # ── Noise Sampling Std Deviations ──
      vx_std: 0.10              # Linear velocity noise for trajectory diversity
      vy_std: 0.0               # Zero for diff drive
      wz_std: 0.30              # Rotational noise — enough diversity for tight maneuvers

      # ── Path Management ──
      prune_distance: 1.5       # Prune path points > 1.5 m behind robot
      transform_tolerance: 0.2  # TF tolerance in seconds

      # ── Visualization (disabled for Jetson Nano CPU savings) ──
      visualize: false
      regenerate_noises: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3

      # ── Critics ────────────────────────────────────────────────────
      critics: [
        "ConstraintCritic",
        "CostCritic",
        "GoalCritic",
        "GoalAngleCritic",
        "PathAlignCritic",
        "PathFollowCritic",
        "PathAngleCritic",
        "PreferForwardCritic"
      ]

      # Enforces kinematic constraints (DiffDrive velocity/acceleration bounds)
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      # ── OBSTACLE AVOIDANCE (critical for Issue 2 — rotation collisions) ──
      # Uses FULL POLYGON footprint collision checking at every sampled trajectory point.
      # This is the parameter that eliminates corner collisions during in-place rotation.
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81          # Strong enough to avoid walls, not so strong it blocks corridors
        critical_cost: 300.0       # > 254 (max costmap) — rely on footprint check, not raw cost
        consider_footprint: true   # CRITICAL: full [[0.48,0.36]...] polygon collision check
        collision_cost: 1000000.0  # Trajectories that collide get effectively infinite cost
        near_goal_distance: 1.0    # Within 1 m of goal, relax cost aversion for docking
        trajectory_point_step: 2   # Check every 2nd point — 7,000 checks/cycle on Nano

      # Attract toward goal XY position
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4  # Only activates within 1.4 m of goal

      # Align heading with goal orientation at the final approach
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5  # Only within 0.5 m — don't rotate prematurely

      # Penalize backward motion — prefer driving forward
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5

      # Follow the global path closely (highest-weighted critic)
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0           # High weight — MPPI tracks the SmacPlanner2D path tightly
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4    # Check every 4th point for alignment (saves CPU)
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false

      # Stay near the path longitudinally (carrot-following behavior)
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4

      # Penalize large heading deviations from the path direction
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0                     # 0 = forward-only angle check


local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # ── POLYGON FOOTPRINT (replaces robot_radius: 0.22) ──
      # 86×62 cm URDF chassis + 5 cm safety margin per side = 96×72 cm virtual footprint
      # inscribed_radius = 0.36 m | circumscribed_radius = 0.60 m
      footprint: "[[0.48, 0.36], [0.48, -0.36], [-0.48, -0.36], [-0.48, 0.36]]"
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0   # Decay: cost = 253×e^(-5.0×Δd). At corridor center
                                   # (Δd=0.04m): cost=207 — passable. (was 3.0)
        inflation_radius: 0.85     # 0.49 m penalty gradient beyond inscribed (0.36 m).
                                   # Cells up to 0.85 m from any obstacle are penalized. (was 0.55)
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
      # ── POLYGON FOOTPRINT (replaces robot_radius: 0.22) ──
      footprint: "[[0.48, 0.36], [0.48, -0.36], [-0.48, -0.36], [-0.48, 0.36]]"
      resolution: 0.05
      track_unknown_space: true    # Unknown cells = NO_INFORMATION (255), not free space
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 2.5   # Matched to obstacle_max_range — prevents raytracing from
                                    # clearing unknown cells beyond reliable detection range.
                                    # This is the Issue 3 fix (boundary overflow). (was 3.0)
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        trinary_costmap: true       # Explicit: free / occupied / unknown (not binary)
        unknown_cost_value: -1      # Map server's unknown value → NO_INFORMATION in costmap
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0    # Identical to local costmap for consistent behavior
        inflation_radius: 0.85     # Identical to local costmap
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: False
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

# ── SmacPlanner2D (replaces NavfnPlanner) ────────────────────────────
# Cost-aware 8-connected A* with built-in path smoother.
# Produces centered, smooth paths — no more wall-hugging.
planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.25              # Tighter goal tolerance for precision docking (was 0.5)
      allow_unknown: false         # ── ISSUE 3 FIX: never plan through unmapped space ── (was true)
      max_iterations: 1000000      # Allow thorough search in complex warehouse layouts
      max_on_approach_iterations: 1000
      max_planning_time: 5.0       # 5 second budget — generous for warehouse scale
      cost_travel_multiplier: 2.0  # Costmap cost penalty: cell_cost = 1.0 + 2.0×(value/252)
                                   # Corridor center (cost 207): 2.64× free space — passable
                                   # when it is the only viable route to the docking station.
      use_final_approach_orientation: false  # Let MPPI handle final heading alignment
      smoother:
        max_iterations: 1000       # Internal A* path smoother — runs before smoother_server
        w_smooth: 0.3              # Smoothness weight (higher = smoother, more deviation)
        w_data: 0.2                # Data fidelity weight (higher = closer to original A* path)
        tolerance: 1.0e-10
        do_refinement: true        # Second pass for tighter smoothing

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True          # Two-stage pipeline: SmacPlanner2D internal → SimpleSmoother

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: false
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.40     # Safe recovery spin speed for 35 kg chassis (was 1.0)
    min_rotational_vel: 0.10     # Allow slow, careful rotations near obstacles (was 0.4)
    rotational_acc_lim: 1.5      # Harmonized with MPPI and velocity_smoother (was 3.2)

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.26, 0.0, 0.50]      # wz: 0.50 matches MPPI wz_max (was 1.0)
    min_velocity: [-0.15, 0.0, -0.50]    # Reverse: 0.15 matches MPPI vx_min (was -0.26)
    max_accel: [2.5, 0.0, 1.5]           # Rotational: 1.5 rad/s² for 35 kg inertia (was 3.2)
    max_decel: [-2.5, 0.0, -1.5]         # Matched to accel limit (was -3.2)
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
